version: '3.8'

services:
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    ports:
      - "3100:3100"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4100
      - WATCHPACK_POLLING=true
      - PORT=3100
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    stdin_open: true
    tty: true

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "4100:4100"
    environment:
      - PORT=4100
      - NODE_ENV=development
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
