services:
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    ports:
      - "3100:3100"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4100
      - WATCHPACK_POLLING=true
      - PORT=3100
      - IS_DOCKER=true
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    stdin_open: true
    tty: true
    command: sh -c "npx next dev -p 3100 -H 0.0.0.0"

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "4100:4100"
    environment:
      - PORT=4100
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/smartagenda
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=smartagenda
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    depends_on:
      - postgres
    stdin_open: true
    tty: true
    command: sh -c "npx prisma generate && pnpm dev"


  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=smartagenda
    volumes:
      - postgres_data:/var/lib/postgresql/data

  startup-banner:
    image: alpine:latest
    depends_on:
      - frontend
      - backend
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        sleep 3
        echo ""
        echo "============================================="
        echo "  🚀 SmartAgenda is starting up!"
        echo "============================================="
        echo ""
        echo "  🌐 Frontend:     http://localhost:3100"
        echo "  🔧 Backend API:  http://localhost:4100/api"
        echo "  📖 Swagger Docs: http://localhost:4100/docs"
        echo "  💚 Health Check: http://localhost:4100/health"
        echo "  🐘 PostgreSQL:   localhost:5432"
        echo ""
        echo "============================================="
        echo "  ⏳ First startup may take a minute while"
        echo "     dependencies install inside containers."
        echo "============================================="
        echo ""

volumes:
  postgres_data:
