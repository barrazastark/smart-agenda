name: Fix Check Status

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for trigger'
        required: true

jobs:
  status-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check status
        run: |
          echo "Checking GitHub Actions status..."
          echo "Available repositories:"
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               https://api.github.com/user/repos
          echo "Checking secrets..."
          echo "VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}"
          echo "VERCEL_PROJECT_ID_FRONTEND: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}"
          echo "VERCEL_PROJECT_ID_BACKEND: ${{ secrets.VERCEL_PROJECT_ID_BACKEND }}"
          echo "VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}"