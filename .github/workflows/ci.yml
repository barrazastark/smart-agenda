name: CI Pipeline

on:
  pull_request:
    branches: [ main, production ]
  push:
    branches: [ main, production ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prettier:
    name: Prettier Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Formatting
        run: pnpm format:check

  lint:
    name: ESLint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint All
        run: pnpm lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Tests
        run: pnpm test

  type-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type Check All
        run: pnpm type-check

  contract-check:
    name: API Contract Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Generate API and Client
        run: pnpm generate
      
      - name: Check for Uncommitted Changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Error: Frontend API client is out of sync with Backend Spec."
            echo "Please run 'pnpm generate' locally and commit the changes."
            git status
            git diff
            exit 1
          else
            echo "API Client is up to date."
          fi

  e2e:
    name: Cypress E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start Backend
        run: |
          cd apps/backend
          DATABASE_URL="postgresql://postgres:password@localhost:5432/smartagenda" \
          NODE_ENV=production \
          pnpm start &
          echo $! > backend_pid.txt
          sleep 5
      - name: Install Cypress binary
        run: npx cypress install
      - name: Run E2E Tests
        env:
          CYPRESS_baseUrl: http://localhost:3100
          NEXT_PUBLIC_API_URL: http://localhost:4100
        run: |
          cd apps/frontend
          pnpm e2e || true
      - name: Cleanup Backend
        if: always()
        run: |
          cd apps/backend
          if [ -f backend_pid.txt ]; then
            kill $(cat backend_pid.txt) || true
          fi
