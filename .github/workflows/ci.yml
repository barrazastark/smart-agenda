name: CI Pipeline

on:
  pull_request:
    branches: [ main, production ]
  push:
    branches: [ main, production ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prettier:
    name: Prettier Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Formatting
        run: pnpm format:check

  lint:
    name: ESLint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint All
        run: pnpm lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Tests
        run: pnpm test

  type-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: |
          cd apps/backend
          npx prisma generate
      - name: Type Check All
        run: pnpm type-check

  contract-check:
    name: API Contract Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Generate API and Client
        run: pnpm generate
      
      - name: Check for Uncommitted Changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Error: Frontend API client is out of sync with Backend Spec."
            echo "Please run 'pnpm generate' locally and commit the changes."
            git status
            git diff
            exit 1
          else
            echo "API Client is up to date."
          fi

  e2e:
    name: Cypress E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: smartagenda
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Backend
        run: pnpm --filter backend build

      - name: Sync Database Schema (Prisma)
        run: |
          cd apps/backend
          DATABASE_URL="postgresql://postgres:password@localhost:5432/smartagenda" npx prisma db push




      - name: Start Backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/smartagenda
          PORT: 4100
          NODE_ENV: test
        run: |
          cd apps/backend
          npx prisma generate
          pnpm dev &
          echo $! > backend_pid.txt
          for i in {1..30}; do
            if curl -s http://localhost:4100/health; then
              echo "Backend is ready!"
              exit 0
            fi
            echo "Waiting for backend ($i/30)..."
            sleep 2
          done
          echo "Error: Backend failed to start"
          exit 1

      
      - name: Install Cypress binary
        run: npx cypress install

      - name: Run E2E Tests
        env:
          CYPRESS_baseUrl: http://localhost:3100
          CYPRESS_apiUrl: http://localhost:4100
          NEXT_PUBLIC_API_URL: http://localhost:4100
        run: |
          cd apps/frontend
          pnpm e2e


      - name: Cleanup Backend
        if: always()
        run: |
          if [ -f apps/backend/backend_pid.txt ]; then
            kill $(cat apps/backend/backend_pid.txt) || true
          fi

